blueprint:
  name: Start timed HVAC override
  description: Start or restart a manual cooling or hold timer and record its expiry before enabling the override. Use with the timed HVAC override expiry blueprint.
  domain: script
  input:
    override_boolean:
      name: Override boolean
      selector:
        entity:
          domain: input_boolean
    override_timer:
      name: Override timer
      selector:
        entity:
          domain: timer
    override_until:
      name: Expiration date and time helper
      description: Must have both date and time enabled.
      selector:
        entity:
          domain: input_datetime
    duration_minutes:
      name: Duration in minutes
      default: 120
      selector:
        number:
          min: 1
          max: 1080
          unit_of_measurement: min
mode: restart
variables:
  minutes: !input duration_minutes
sequence:
  - action: timer.start
    target:
      entity_id: !input override_timer
    data:
      duration: "{{ minutes | int * 60 }}"
  - action: input_datetime.set_datetime
    target:
      entity_id: !input override_until
    data:
      datetime: "{{ (now() + timedelta(minutes=minutes | int)).strftime('%Y-%m-%d %H:%M:%S') }}"
  - action: input_boolean.turn_on
    target:
      entity_id: !input override_boolean
